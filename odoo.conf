[options]
; Rutas donde Odoo busca modulos (se separan con comas).
; /mnt/extra-addons/contract es el repositorio OCA que contiene el
; modulo de contratos recurrentes. Para anadir otro repo de la OCA:
;   git clone --depth 1 --branch 19.0 <url> extra-addons/<nombre>
; y agrega ",/mnt/extra-addons/<nombre>" aqui abajo.
addons_path = /mnt/extra-addons/contract

; Contrasena "maestra" para gestionar bases de datos en
; http://localhost:8069/web/database/manager  (CAMBIALA si expones esto).
admin_passwd = admin

; Directorio de datos (filestore). El volumen del compose lo mapea a ./data/odoo
data_dir = /var/lib/odoo

; Conexion a PostgreSQL (coincide con el servicio "db" del docker-compose).
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
